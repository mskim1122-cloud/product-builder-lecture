<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로또 번호 추천</title>
<style>
  :root {
    --bg-1: #0f1024;
    --bg-2: #1b1f4b;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --text-main: #f4f4fb;
    --text-sub: #a6a8c9;
    --accent: #ffd23f;
    --accent-2: #7c5cff;
    --yellow: #fbc400;
    --blue: #69c8f2;
    --red: #ff7272;
    --gray: #aaaaaa;
    --green: #b0d840;
    color-scheme: dark;
  }

  html[data-theme="light"] {
    --bg-1: #f4f5fb;
    --bg-2: #e7e9fb;
    --card-bg: rgba(0, 0, 0, 0.035);
    --card-border: rgba(0, 0, 0, 0.1);
    --text-main: #1c1d33;
    --text-sub: #5c5e80;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    background: radial-gradient(circle at 20% 10%, var(--bg-2), var(--bg-1) 60%);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    padding: 40px 16px 80px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text-main);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(12px);
    z-index: 10;
  }
  .theme-toggle:hover { border-color: var(--text-main); }

  .wrap {
    width: 100%;
    max-width: 720px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
  }

  header p {
    margin: 0;
    color: var(--text-sub);
    font-size: 14px;
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 28px 24px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    margin-bottom: 24px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  .controls label {
    font-size: 13px;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.04);
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
  }

  select {
    background: transparent;
    color: var(--text-main);
    border: none;
    font-size: 13px;
    outline: none;
  }
  select option { color: #111; }

  .exclude-input {
    background: transparent;
    color: var(--text-main);
    border: none;
    outline: none;
    width: 110px;
    font-size: 13px;
  }
  .exclude-input::placeholder { color: var(--text-sub); }

  .generate-btn {
    display: block;
    margin: 0 auto 8px;
    padding: 16px 48px;
    font-size: 17px;
    font-weight: 700;
    color: #1a1a2e;
    background: linear-gradient(90deg, var(--accent), #ffb347);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 210, 63, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .generate-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(255, 210, 63, 0.45);
  }
  .generate-btn:active { transform: translateY(0); }

  .sets {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .set-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 16px;
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.4s ease forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .set-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    width: 22px;
    flex-shrink: 0;
  }

  .balls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ball {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #17181f;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.15), 0 4px 8px rgba(0,0,0,0.3);
    flex-shrink: 0;
    animation: pop 0.35s ease backwards;
  }

  @keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  .ball.y { background: var(--yellow); }
  .ball.b { background: var(--blue); color: #0d2a3a; }
  .ball.r { background: var(--red); }
  .ball.g { background: var(--gray); color: #fff; }
  .ball.e { background: var(--green); }

  .empty-hint {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    padding: 24px 0;
  }

  .history-panel h2 {
    font-size: 15px;
    margin: 0 0 14px;
    color: var(--text-sub);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .clear-btn {
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text-sub);
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .clear-btn:hover { color: var(--text-main); border-color: var(--text-main); }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 260px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-sub);
  }

  .history-item .balls .ball {
    width: 26px;
    height: 26px;
    font-size: 11px;
    animation: none;
  }

  .history-item time {
    flex-shrink: 0;
    width: 78px;
  }

  footer {
    text-align: center;
    color: var(--text-sub);
    font-size: 12px;
    margin-top: 20px;
    line-height: 1.6;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="테마 전환" title="다크/화이트 모드 전환">🌙</button>
  <div class="wrap">
    <header>
      <h1>🎱 로또 번호 추천</h1>
      <p>완전 무작위 알고리즘으로 뽑는 나만의 행운 번호</p>
    </header>

    <div class="panel">
      <div class="controls">
        <label>
          게임 수
          <select id="gameCount">
            <option value="1">1게임</option>
            <option value="5" selected>5게임</option>
            <option value="10">10게임</option>
          </select>
        </label>
        <label>
          제외 번호
          <input class="exclude-input" id="excludeInput" type="text" placeholder="예: 4, 13, 22" />
        </label>
      </div>

      <button class="generate-btn" id="generateBtn">번호 생성하기</button>

      <div class="sets" id="sets">
        <p class="empty-hint">버튼을 눌러 행운의 번호를 뽑아보세요 ✨</p>
      </div>
    </div>

    <div class="panel history-panel">
      <h2>
        최근 생성 기록
        <button class="clear-btn" id="clearBtn">기록 지우기</button>
      </h2>
      <div class="history-list" id="historyList">
        <p class="empty-hint" style="padding:8px 0;">아직 생성 기록이 없어요</p>
      </div>
    </div>

    <footer>
      본 서비스는 랜덤 번호 생성을 위한 재미용 도구이며, 당첨을 보장하지 않습니다.<br />
      번호는 브라우저에만 저장되며 서버로 전송되지 않습니다.<br />
      <a href="partners.html" style="color: var(--text-sub);">제휴 문의</a>
    </footer>
  </div>

<script>
  const setsEl = document.getElementById('sets');
  const historyListEl = document.getElementById('historyList');
  const generateBtn = document.getElementById('generateBtn');
  const gameCountEl = document.getElementById('gameCount');
  const excludeInputEl = document.getElementById('excludeInput');
  const clearBtn = document.getElementById('clearBtn');
  const themeToggle = document.getElementById('themeToggle');

  const STORAGE_KEY = 'lotto-history-v1';
  const THEME_KEY = 'lotto-theme-v1';

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'light' ? '☀️' : '🌙';
  }

  function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'light' || saved === 'dark') {
      applyTheme(saved);
      return;
    }
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    applyTheme(prefersLight ? 'light' : 'dark');
  }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem(THEME_KEY, next);
  });

  initTheme();

  function colorClass(n) {
    if (n <= 10) return 'y';
    if (n <= 20) return 'b';
    if (n <= 30) return 'r';
    if (n <= 40) return 'g';
    return 'e';
  }

  function parseExclude(text) {
    return text
      .split(/[,\s]+/)
      .map(s => parseInt(s, 10))
      .filter(n => Number.isInteger(n) && n >= 1 && n <= 45);
  }

  function generateOneSet(excluded) {
    const pool = [];
    for (let i = 1; i <= 45; i++) {
      if (!excluded.includes(i)) pool.push(i);
    }
    if (pool.length < 6) {
      throw new Error('제외한 번호가 너무 많아 6개를 뽑을 수 없어요.');
    }
    const picked = [];
    while (picked.length < 6) {
      const idx = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(idx, 1)[0]);
    }
    return picked.sort((a, b) => a - b);
  }

  function renderBalls(numbers, size) {
    const ballsDiv = document.createElement('div');
    ballsDiv.className = 'balls';
    numbers.forEach((n, i) => {
      const b = document.createElement('div');
      b.className = 'ball ' + colorClass(n);
      b.textContent = n;
      b.style.animationDelay = (i * 0.05) + 's';
      ballsDiv.appendChild(b);
    });
    return ballsDiv;
  }

  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveHistory(history) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 30)));
  }

  function renderHistory() {
    const history = loadHistory();
    historyListEl.innerHTML = '';
    if (history.length === 0) {
      historyListEl.innerHTML = '<p class="empty-hint" style="padding:8px 0;">아직 생성 기록이 없어요</p>';
      return;
    }
    history.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'history-item';
      const time = document.createElement('time');
      time.textContent = entry.time;
      row.appendChild(time);
      row.appendChild(renderBalls(entry.numbers));
      historyListEl.appendChild(row);
    });
  }

  function addToHistory(numbers) {
    const history = loadHistory();
    const now = new Date();
    const time = now.toLocaleString('ko-KR', {
      month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
    });
    history.unshift({ numbers, time });
    saveHistory(history);
  }

  function generate() {
    setsEl.innerHTML = '';
    const excluded = parseExclude(excludeInputEl.value);
    const count = parseInt(gameCountEl.value, 10);
    const labels = 'ABCDEFGHIJ';

    try {
      for (let i = 0; i < count; i++) {
        const numbers = generateOneSet(excluded);
        const row = document.createElement('div');
        row.className = 'set-row';
        row.style.animationDelay = (i * 0.06) + 's';

        const label = document.createElement('div');
        label.className = 'set-label';
        label.textContent = labels[i] || (i + 1);
        row.appendChild(label);
        row.appendChild(renderBalls(numbers));
        setsEl.appendChild(row);

        addToHistory(numbers);
      }
      renderHistory();
    } catch (err) {
      setsEl.innerHTML = `<p class="empty-hint">${err.message}</p>`;
    }
  }

  clearBtn.addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
  });

  generateBtn.addEventListener('click', generate);

  renderHistory();
</script>
</body>
</html>
