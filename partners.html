<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>제휴 문의</title>
<style>
  :root {
    --bg-1: #0f1024;
    --bg-2: #1b1f4b;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --text-main: #f4f4fb;
    --text-sub: #a6a8c9;
    --accent: #ffd23f;
    --accent-2: #7c5cff;
    --danger: #ff7272;
    --success: #b0d840;
    color-scheme: dark;
  }

  html[data-theme="light"] {
    --bg-1: #f4f5fb;
    --bg-2: #e7e9fb;
    --card-bg: rgba(0, 0, 0, 0.035);
    --card-border: rgba(0, 0, 0, 0.1);
    --text-main: #1c1d33;
    --text-sub: #5c5e80;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    background: radial-gradient(circle at 20% 10%, var(--bg-2), var(--bg-1) 60%);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    padding: 40px 16px 80px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text-main);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(12px);
    z-index: 10;
  }
  .theme-toggle:hover { border-color: var(--text-main); }

  .wrap {
    width: 100%;
    max-width: 560px;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: var(--text-sub);
    text-decoration: none;
    font-size: 13px;
  }
  .back-link:hover { color: var(--text-main); }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: clamp(26px, 5vw, 34px);
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
  }

  header p {
    margin: 0;
    color: var(--text-sub);
    font-size: 14px;
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 28px 24px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }

  form { display: flex; flex-direction: column; gap: 16px; }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .field label {
    font-size: 13px;
    color: var(--text-sub);
    font-weight: 600;
  }

  .field input,
  .field textarea {
    background: rgba(127, 127, 127, 0.08);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text-main);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input:focus,
  .field textarea:focus { border-color: var(--accent-2); }
  .field input::placeholder,
  .field textarea::placeholder { color: var(--text-sub); }

  .field textarea { resize: vertical; min-height: 120px; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 520px) {
    .two-col { grid-template-columns: 1fr; }
  }

  .submit-btn {
    display: block;
    margin: 8px auto 0;
    padding: 16px 48px;
    font-size: 16px;
    font-weight: 700;
    color: #1a1a2e;
    background: linear-gradient(90deg, var(--accent), #ffb347);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 210, 63, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255, 210, 63, 0.45); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .status-msg {
    text-align: center;
    font-size: 13px;
    margin-top: 4px;
    min-height: 18px;
  }
  .status-msg.success { color: var(--success); }
  .status-msg.error { color: var(--danger); }

  footer {
    text-align: center;
    color: var(--text-sub);
    font-size: 12px;
    margin-top: 20px;
    line-height: 1.6;
  }

  /* honeypot field, hidden from real users */
  .hp-field { position: absolute; left: -9999px; }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="테마 전환" title="다크/화이트 모드 전환">🌙</button>
  <div class="wrap">
    <a class="back-link" href="index.html">← 로또 번호 추천으로 돌아가기</a>

    <header>
      <h1>🤝 제휴 문의</h1>
      <p>협업이나 제휴를 원하시면 아래 양식을 남겨주세요. 빠르게 답변드리겠습니다.</p>
    </header>

    <div class="panel">
      <form id="partnerForm">
        <div class="two-col">
          <div class="field">
            <label for="company">회사/단체명</label>
            <input type="text" id="company" name="company" placeholder="예: (주)행운컴퍼니" />
          </div>
          <div class="field">
            <label for="name">담당자명 *</label>
            <input type="text" id="name" name="name" placeholder="홍길동" required />
          </div>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="email">이메일 *</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="phone">연락처</label>
            <input type="tel" id="phone" name="phone" placeholder="010-1234-5678" />
          </div>
        </div>

        <div class="field">
          <label for="message">문의 내용 *</label>
          <textarea id="message" name="message" placeholder="제휴 제안 내용을 자유롭게 작성해주세요." required></textarea>
        </div>

        <input class="hp-field" type="text" name="_gotcha" tabindex="-1" autocomplete="off" />

        <button class="submit-btn" id="submitBtn" type="submit">문의 보내기</button>
        <p class="status-msg" id="statusMsg"></p>
      </form>
    </div>

    <footer>
      보내주신 정보는 제휴 문의 확인 및 회신 목적으로만 사용됩니다.
    </footer>
  </div>

<script>
  const themeToggle = document.getElementById('themeToggle');
  const THEME_KEY = 'lotto-theme-v1';

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'light' ? '☀️' : '🌙';
  }

  function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'light' || saved === 'dark') {
      applyTheme(saved);
      return;
    }
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    applyTheme(prefersLight ? 'light' : 'dark');
  }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem(THEME_KEY, next);
  });

  initTheme();

  const FORM_ENDPOINT = 'https://formspree.io/f/xwlkdooy';
  const form = document.getElementById('partnerForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';
    submitBtn.disabled = true;
    submitBtn.textContent = '전송 중...';

    try {
      const res = await fetch(FORM_ENDPOINT, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form),
      });

      if (res.ok) {
        statusMsg.textContent = '문의가 정상적으로 접수되었습니다. 감사합니다!';
        statusMsg.classList.add('success');
        form.reset();
      } else {
        const data = await res.json().catch(() => null);
        const errMsg = data && data.errors && data.errors.length
          ? data.errors.map(e => e.message).join(', ')
          : '전송에 실패했습니다. 잠시 후 다시 시도해주세요.';
        statusMsg.textContent = errMsg;
        statusMsg.classList.add('error');
      }
    } catch (err) {
      statusMsg.textContent = '네트워크 오류로 전송하지 못했습니다. 잠시 후 다시 시도해주세요.';
      statusMsg.classList.add('error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '문의 보내기';
    }
  });
</script>
</body>
</html>
